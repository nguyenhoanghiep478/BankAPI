server:
  port: 8080

spring:
  application:
    name: BANKAPI
  datasource:
    url: jdbc:mysql://${DB_HOST_DOCKER_ACTIVE}:3307/${DB_NAME_DOCKER_ACTIVE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    hibernate:
      ddl-auto: update
  config:
    import: optional:file:.env[.properties]
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  mail:
    default-encoding: UTF-8
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER_NAME}
    password: ${GMAIL_ROOT_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org:
      springframework:
        security: DEBUG
        security.web:
          FilterChainProxy: DEBUG
          access:
            ExceptionTranslationFilter: DEBUG
            intercept:
              FilterSecurityInterceptor: DEBUG
          authentication:
            UsernamePasswordAuthenticationFilter: DEBUG
          firewall: DEBUG
        jdbc:
          core:
            org.springframework.jdbc.core.JdbcTemplate: DEBUG
          datasource:
            org.springframework.jdbc.datasource.DataSourceUtils : DEBUG


springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
openapi:
    title: Bank API Document
    version: 2.0
    description : Bank API Service
    serverURL :
    serverName : serverTest
management:
  endpoints:
    web:
      exposure:
        include: *
