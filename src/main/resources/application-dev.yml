server:
  port: 8022
spring:
  application:
    name: ${APP_NAME_DEV}
  datasource:
    url: jdbc:mysql://${DB_HOST_DEV}:3306/${DB_NAME_DEV}
    username: ${DB_USERNAME_DEV}
    password: ${DB_PASSWORD_DEV}
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: Iv23liUaViW71mNL4xeF
            client-secret: 91f007c6b577a21aa2f3bf934c50aab4acb30565
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    hibernate:
      ddl-auto: update
  config:
    import: optional:file:.env[.properties]
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  mail:
    default-encoding: UTF-8
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USER_NAME}`
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  data:
    redis:
      host: localhost
      port: 6379


logging:
  level:
    org:
      springframework:
        security: DEBUG
        security.web:
          FilterChainProxy: DEBUG
          access:
            ExceptionTranslationFilter: DEBUG
            intercept:
              FilterSecurityInterceptor: DEBUG
          authentication:
            UsernamePasswordAuthenticationFilter: DEBUG
          firewall: DEBUG
        boot:
          autoconfigure:
            jdbc:
              DataSourceConfiguration: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
openapi:
    title: Bank API Document
    version: 2.0
    description : Bank API Service
    serverURL :
    serverName : serverTest
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
